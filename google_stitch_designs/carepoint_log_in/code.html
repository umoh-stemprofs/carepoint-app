</head><body class="bg-surface-container-lowest font-body-lg text-body-lg text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col" style="background-color: rgb(255, 255, 255); min-height: 100vh;"><main class="flex-1 flex flex-col relative w-full bg-surface-container-lowest"><div class="flex flex-col w-full px-margin pb-space-lg">
<!-- Brand & Read-Aloud Header -->
<div class="flex items-center justify-between pt-space-xs mb-space-md">
<div class="flex items-center gap-space-xs">
<div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: &quot;FILL&quot; 1;">shield_with_heart</span>
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface leading-tight tracking-tight">CarePoint</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant font-bold leading-none">Health Access</p>
</div>
</div>
<!-- Auditory Assistance Trigger -->

</div>
<!-- Audio Prompt Banner -->

<!-- Role Toggle: Tactile Dual Choice (No borders, clear solid contrast) -->
<div aria-label="Select your role" class="flex flex-col gap-space-xs mb-space-lg" role="radiogroup">
<button aria-checked="true" class="w-full min-h-[64px] rounded-2xl bg-primary text-on-primary p-space-xs flex items-center justify-between shadow-sm transition-all" id="patientRoleBtn" onclick="selectRole('patient')" role="radio" type="button">
<div class="flex items-center gap-space-xs">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: &quot;FILL&quot; 1;">person</span>
</div>
<span class="font-label-lg text-label-lg tracking-wide uppercase font-bold">I am a Patient</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-lowest text-primary flex items-center justify-center" id="patientCheck">
<span class="material-symbols-outlined text-[22px] font-bold">check</span>
</div>
</button>
<button aria-checked="false" class="w-full min-h-[64px] rounded-2xl bg-surface-container text-on-surface p-space-xs flex items-center justify-between transition-all" id="doctorRoleBtn" onclick="selectRole('doctor')" role="radio" type="button">
<div class="flex items-center gap-space-xs">
<div class="w-12 h-12 rounded-xl bg-surface-container-highest flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: &quot;FILL&quot; 1;">stethoscope</span>
</div>
<span class="font-label-lg text-label-lg tracking-wide uppercase font-bold">I am a Doctor</span>
</div>
<div class="w-8 h-8 rounded-full bg-transparent flex items-center justify-center" id="doctorCheck"></div>
</button>
</div>
<!-- Sign In Form Inputs -->
<form class="flex flex-col gap-space-md mb-space-lg" onsubmit="event.preventDefault();">
<!-- Identifier Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 font-label-lg text-label-lg text-on-surface" for="loginId">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: &quot;FILL&quot; 1;">call</span>
<span class="">Phone or Email</span>
</label>
<button aria-label="Listen to phone or email instruction" class="text-primary flex items-center" onclick="triggerSpeech('Enter your mobile telephone number or your email address')" type="button">

</button>
</div>
<div class="relative flex items-center w-full">
<input class="w-full h-16 pl-4 pr-16 bg-surface-container-low text-on-surface rounded-2xl font-body-xl text-body-xl focus:bg-surface-container-lowest focus:outline-none focus:ring-4 focus:ring-primary/20 placeholder:text-outline" id="loginId" inputmode="text" placeholder="e.g. 555-0199 or name" type="text">
<button aria-label="Speak your phone or email" class="absolute right-2 w-12 h-12 rounded-xl bg-surface-container text-primary flex items-center justify-center active:scale-95" id="micBtn" onclick="toggleMic()" type="button">
<span class="material-symbols-outlined text-[24px]" id="micIcon">mic</span>
</button>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 font-label-lg text-label-lg text-on-surface" for="loginPassword">
<span class="material-symbols-outlined text-primary text-[24px]" style="font-variation-settings: &quot;FILL&quot; 1;">lock</span>
<span class="">Secret Code / Password</span>
</label>
<button aria-label="Listen to password instruction" class="text-primary flex items-center" onclick="triggerSpeech('Enter your secret code or password')" type="button">

</button>
</div>
<div class="relative flex items-center w-full">
<input class="w-full h-16 pl-4 pr-16 bg-surface-container-low text-on-surface rounded-2xl font-body-xl text-body-xl focus:bg-surface-container-lowest focus:outline-none focus:ring-4 focus:ring-primary/20 placeholder:text-outline" id="loginPassword" placeholder="••••••••" type="password">
<button aria-label="Show or hide secret code" class="absolute right-2 w-12 h-12 rounded-xl bg-surface-container text-on-surface-variant flex items-center justify-center active:scale-95" id="togglePwBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[24px]" id="pwIcon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-16 rounded-2xl bg-primary text-on-primary font-label-xl text-label-xl flex items-center justify-center gap-space-xs shadow-md active:translate-y-0.5 transition-transform mt-space-xs" type="submit">
<span class="">Log In to CarePoint</span>
<span class="material-symbols-outlined text-[28px]">arrow_forward</span>
</button>
</form>
<!-- Friendly Help Action -->
<button class="w-full min-h-[56px] rounded-2xl bg-surface-container-low text-primary flex items-center justify-center gap-space-xs font-label-lg text-label-lg mb-space-xl active:bg-surface-container" onclick="triggerSpeech('Need help signing in? Tap the red button below if this is an emergency, or ask a family member for assistance.')" type="button">
<span class="material-symbols-outlined text-[26px]">help_center</span>
<span class="">Need Help Signing In?</span>
</button>
<!-- Emergency 112 Pad: High Contrast Crimson -->
<div class="mt-auto pt-space-xs">
<a aria-label="Emergency call 112" class="w-full min-h-[64px] rounded-2xl bg-tertiary text-on-tertiary flex items-center justify-between px-space-md shadow-md active:scale-95 transition-transform" href="tel:112">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[32px] animate-bounce" style="font-variation-settings: &quot;FILL&quot; 1;">e911_emergency</span>
<div class="flex flex-col text-left">
<span class="font-label-xl text-label-xl leading-none font-bold">EMERGENCY?</span>
<span class="font-body-lg text-body-lg text-on-tertiary leading-tight opacity-90">Call 112 Free</span>
</div>
</div>
<div class="w-12 h-12 rounded-xl bg-tertiary-container flex items-center justify-center text-on-tertiary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: &quot;FILL&quot; 1;">phone_in_talk</span>
</div>
</a>
</div>
</div>
<script>
  function selectRole(role) {
    const pBtn = document.getElementById('patientRoleBtn');
    const dBtn = document.getElementById('doctorRoleBtn');
    const pCheck = document.getElementById('patientCheck');
    const dCheck = document.getElementById('doctorCheck');

    if (role === 'patient') {
      pBtn.className = "w-full min-h-[64px] rounded-2xl bg-primary text-on-primary p-space-xs flex items-center justify-between shadow-sm transition-all";
      pBtn.setAttribute('aria-checked', 'true');
      pCheck.innerHTML = '<span class="material-symbols-outlined text-[22px] font-bold">check</span>';
      pCheck.className = 'w-8 h-8 rounded-full bg-surface-container-lowest text-primary flex items-center justify-center';

      dBtn.className = "w-full min-h-[64px] rounded-2xl bg-surface-container text-on-surface p-space-xs flex items-center justify-between transition-all";
      dBtn.setAttribute('aria-checked', 'false');
      dCheck.innerHTML = '';
      dCheck.className = 'w-8 h-8 rounded-full bg-transparent flex items-center justify-center';
      triggerSpeech('Patient role selected');
    } else {
      dBtn.className = "w-full min-h-[64px] rounded-2xl bg-secondary text-on-secondary p-space-xs flex items-center justify-between shadow-sm transition-all";
      dBtn.setAttribute('aria-checked', 'true');
      dCheck.innerHTML = '<span class="material-symbols-outlined text-[22px] font-bold">check</span>';
      dCheck.className = 'w-8 h-8 rounded-full bg-surface-container-lowest text-secondary flex items-center justify-center';

      pBtn.className = "w-full min-h-[64px] rounded-2xl bg-surface-container text-on-surface p-space-xs flex items-center justify-between transition-all";
      pBtn.setAttribute('aria-checked', 'false');
      pCheck.innerHTML = '';
      pCheck.className = 'w-8 h-8 rounded-full bg-transparent flex items-center justify-center';
      triggerSpeech('Doctor role selected');
    }
  }

  function togglePasswordVisibility() {
    const pw = document.getElementById('loginPassword');
    const icon = document.getElementById('pwIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pw.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function toggleMic() {
    const mic = document.getElementById('micIcon');
    const input = document.getElementById('loginId');
    if (mic.textContent === 'mic') {
      mic.textContent = 'graphic_eq';
      triggerSpeech('Listening. Please speak your phone number.');
      setTimeout(() => {
        if (!input.value) {
          input.value = '+1 (555) 382-9012';
        }
        mic.textContent = 'mic';
      }, 2500);
    }
  }

  function triggerSpeech(phrase) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }
</script></main>


</body></html>
