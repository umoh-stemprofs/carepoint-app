  </head><body class="bg-surface-container-lowest font-body-lg text-body-lg text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col" style="background-color: rgb(255, 255, 255); min-height: 100vh;"><main class="flex-1 flex flex-col relative w-full bg-surface-container-lowest"><div class="flex flex-col w-full bg-surface-container-lowest px-margin pb-space-lg">
<!-- Header: Visual Shield & Direct Read-Aloud Title -->
<header class="w-full flex items-center justify-between py-space-sm mb-space-xs"><div class="flex items-center gap-3"><div class="w-12 h-12 rounded-xl bg-[#005f41] flex items-center justify-center text-white shadow-sm shrink-0"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 14h-2v-3H8v-2h3V8h2v3h3v2h-3v3z"></path></svg></div><div><h1 class="text-[22px] font-extrabold text-[#141b2b] tracking-tight leading-none">CarePoint</h1><p class="text-[15px] font-bold text-[#005f41] tracking-wide mt-1 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#10b981] inline-block"></span>See A Doctor</p></div></div></header>
<!-- Speech Feedback Banner (Dynamic Alert on Tap) -->

<!-- Main Body: Two Giant Pictogram Cards -->
<div class="w-full flex flex-col gap-space-md my-auto"><!-- CARD 1: Emerald Doctor Now -->
<div class="w-full bg-[#057a55] hover:bg-[#005f41] text-white rounded-[24px] p-5 shadow-lg active:scale-[0.99] transition-all select-none relative overflow-hidden">
  <div class="flex items-center justify-between gap-3" onclick="handleCardPress('doctor')" role="button" tabindex="0">
    <div class="w-16 h-16 rounded-full bg-white text-[#057a55] flex items-center justify-center shrink-0 shadow-md">
      <!-- Clean doctor vector icon -->
      <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <circle cx="12" cy="7" r="4" fill="#e6f4ea" stroke="currentColor"></circle>
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2" fill="#e6f4ea"></path>
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 13v3a3 3 0 006 0v-3" stroke="#057a55" stroke-width="2"></path>
        <circle cx="15" cy="13" r="1" fill="#057a55"></circle>
      </svg>
    </div>
    <div class="flex flex-col flex-1 min-w-0 pr-1">
      <span class="text-[23px] font-extrabold text-white leading-tight uppercase tracking-tight">
        BOOK DOCTOR NOW
      </span>
      <div class="flex items-center gap-1.5 mt-1.5 text-[#a5ffd3] text-[15px] font-semibold">
        <span class="material-symbols-outlined text-[20px]">videocam</span>
        <span class="">Instant video call</span>
      </div>
    </div>
    <div aria-label="Listen to description for Book Doctor" class="w-12 h-12 rounded-full bg-[#004f36] hover:bg-[#003826] text-white flex items-center justify-center shrink-0 shadow-sm" onclick="event.stopPropagation(); playAudioPrompt('Tap green to book an immediate video call with a friendly doctor.');" role="button" tabindex="0">
      <span class="material-symbols-outlined text-[26px]">volume_up</span>
    </div>
  </div>
</div>

<!-- CARD 2: Vibrant Blue Appointments -->
<div class="w-full bg-[#1d4ed8] hover:bg-[#1e40af] text-white rounded-[24px] p-5 shadow-lg active:scale-[0.99] transition-all select-none relative overflow-hidden">
  <div class="flex items-center justify-between gap-3" onclick="handleCardPress('calendar')" role="button" tabindex="0">
    <div class="w-16 h-16 rounded-full bg-white text-[#1d4ed8] flex items-center justify-center shrink-0 shadow-md relative">
      <!-- Calendar Vector Icon with checkmark badge -->
      <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="3" ry="3" fill="#eff6ff"></rect>
        <line x1="16" y1="2" x2="16" y2="6" stroke-linecap="round"></line>
        <line x1="8" y1="2" x2="8" y2="6" stroke-linecap="round"></line>
        <line x1="3" y1="10" x2="21" y2="10" stroke-width="1.5"></line>
      </svg>
      <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-[#10b981] text-white flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
      </div>
    </div>
    <div class="flex flex-col flex-1 min-w-0 pr-1">
      <span class="text-[23px] font-extrabold text-white leading-tight uppercase tracking-tight">
        MY APPOINTMENTS
      </span>
      <div class="flex items-center gap-1.5 mt-1.5 text-[#b7c4ff] text-[15px] font-semibold">
        <span class="material-symbols-outlined text-[20px]">schedule</span>
        <span class="">Check booked time</span>
      </div>
    </div>
    <div aria-label="Listen to description for My Appointments" class="w-12 h-12 rounded-full bg-[#153eb3] hover:bg-[#102f8a] text-white flex items-center justify-center shrink-0 shadow-sm" onclick="event.stopPropagation(); playAudioPrompt('Tap blue to review your doctor appointment times and reminders.');" role="button" tabindex="0">
      <span class="material-symbols-outlined text-[26px]">volume_up</span>
    </div>
  </div>
</div></div>
<!-- Reassuring visual hint of human care -->
<div class="w-full py-space-sm flex items-center justify-center gap-space-xs text-on-surface-variant font-body-lg text-body-lg text-center mt-2"><span class="material-symbols-outlined text-[24px] text-[#005f41]">favorite</span><span class="text-[17px] font-semibold text-[#3e4943]">No reading required. Doctors talk with you directly.</span></div>
<!-- Bottom Emergency Pad (Isolated, Heavy Contrast Red) -->
<div class="w-full mt-space-sm pt-space-xs"><button aria-label="Emergency? Call 112" class="w-full h-16 min-h-[64px] bg-[#dc2626] hover:bg-[#b91c1c] active:scale-[0.98] text-white rounded-[20px] px-5 flex items-center justify-between shadow-xl transition-all select-none" id="btn-emergency" onclick="handleEmergencyCall()"><div class="w-11 h-11 rounded-full bg-[#991b1b] flex items-center justify-center shrink-0 animate-pulse"><span class="material-symbols-outlined text-[28px] text-white">emergency</span></div><span class="text-[21px] font-black tracking-wide uppercase flex-1 text-center">Emergency? Call 112</span><div class="w-11 h-11 rounded-full bg-[#b91c1c] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[26px] text-white">call</span></div></button></div>
</div>
<script>
  // Simple spoken speech synthesis helper for non-literate navigation
  function playAudioPrompt(message) {
    const banner = document.getElementById('audio-indicator');
    const bannerText = document.getElementById('audio-indicator-text');
    
    if (banner && bannerText) {
      bannerText.textContent = message;
      banner.classList.remove('hidden');
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.rate = 0.9; // Slightly slower for enhanced cognitive parsing
      utterance.pitch = 1.0;
      utterance.onend = () => {
        setTimeout(() => {
          if (banner) banner.classList.add('hidden');
        }, 2000);
      };
      window.speechSynthesis.speak(utterance);
    } else {
      setTimeout(() => {
        if (banner) banner.classList.add('hidden');
      }, 3500);
    }
  }

  function handleCardPress(type) {
    if (type === 'doctor') {
      playAudioPrompt('Connecting you to a doctor now. Please hold on.');
    } else if (type === 'calendar') {
      playAudioPrompt('Opening your scheduled appointments list.');
    }
  }

  function handleEmergencyCall() {
    playAudioPrompt('Calling emergency services on 112 immediately.');
    setTimeout(() => {
      window.location.href = 'tel:112';
    }, 600);
  }
</script></main>
