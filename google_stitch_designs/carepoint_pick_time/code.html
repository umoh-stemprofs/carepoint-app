<div class="relative w-10 h-10 rounded-full overflow-hidden bg-primary-fixed flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="Close-up warm headshot of female physician Dr. Sarah wearing clean teal scrubs and a stethoscope smiling gently against a bright clinical background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_EHnZbLgA8APPFF_k-d63ZZCVivQxBVraQbGE-nSojnmXyMDjcRHlQIeci6fZi0239pGKgLEgOg1fefVPRPFQcXMGbKMI1SDjyWYLjUvinsKvYOgPf19LyTGFmpNKuR7Y-htzRTh5OsW7wXRhtoR8GijCIdyENqK0Eu96_bRC-T6FGRo8V3NQfprroQ_YGdjro_6io7njLMNLVLUE9RvJgbLd-jTezwoWehPGHcR0oY6NUrse8Pm7rQ">
<span class="absolute bottom-0 right-0 w-3 h-3 bg-primary-container rounded-full ring-2 ring-surface-container-lowest"></span>
</div>
<div class="text-left">
<span class="block font-label-lg text-label-lg text-on-surface leading-tight">Dr. Sarah</span>
<span class="block text-primary font-bold text-xs tracking-wide">ONLINE NOW</span>
</div>
</div>

</header>
<!-- Interactive Time Selection Cards (2x2 Grid) -->
<section aria-label="Available time of day slots" class="px-margin pt-3 pb-2">
<div aria-label="Appointment Time Options" class="grid grid-cols-2 gap-3" role="radiogroup">
<!-- 1. MORNING SLOT -->
<div aria-checked="false" class="time-card relative bg-surface-container-low rounded-xl p-4 flex flex-col justify-between min-h-[148px] shadow-sm active:scale-95 transition-all cursor-pointer" onclick="selectSlot(this, 'Morning at 9:00 AM')" role="radio" tabindex="0">
<!-- Top Status & Audio Button -->
<div class="flex items-center justify-between w-full">
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary-container text-[30px]" style="font-variation-settings: &quot;FILL&quot; 1;">wb_sunny</span>
</div>
<button aria-label="Read Morning slot time" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant" onclick="event.stopPropagation(); speakInstruction('Morning slot, 9:00 AM')" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
<!-- Label and Time -->
<div class="mt-2 text-left">
<span class="block font-label-lg text-label-lg text-on-surface uppercase tracking-wide">Morning</span>
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-surface">9:00 <span class="text-label-lg font-bold">AM</span></span>
</div>
<!-- Selection Checkmark Placeholder -->
<div class="check-badge hidden absolute top-3 right-3 w-8 h-8 rounded-full bg-primary-container text-on-primary items-center justify-center">
<span class="material-symbols-outlined text-[22px]">check</span>
</div>
</div>
<!-- 2. MIDDAY SLOT (Active / Selected by default) -->

<!-- Top Status & Audio Button -->
<div class="flex items-center justify-between w-full">
<div class="w-11 h-11 rounded-lg bg-primary text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: &quot;FILL&quot; 1;">light_mode</span>
</div>
<button aria-label="Read Midday slot time" class="w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-on-primary-fixed-variant" onclick="event.stopPropagation(); speakInstruction('Midday slot, 12:00 PM. Currently selected.')" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
<!-- Label and Time -->
<div class="mt-2 text-left">
<span class="block font-label-lg text-label-lg text-on-primary uppercase tracking-wide">Midday</span>
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-primary">12:00 <span class="text-label-lg font-bold">PM</span></span>
</div>
<!-- Selection Checkmark Indicator -->
<div class="check-badge flex absolute top-3 right-3 w-8 h-8 rounded-full bg-surface-container-lowest text-primary-container items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[24px] font-bold">check</span>
</div>
</div>
<!-- 3. AFTERNOON SLOT -->
<div aria-checked="false" class="time-card relative bg-surface-container-low rounded-xl p-4 flex flex-col justify-between min-h-[148px] shadow-sm active:scale-95 transition-all cursor-pointer" onclick="selectSlot(this, 'Afternoon at 3:00 PM')" role="radio" tabindex="0">
<!-- Top Status & Audio Button -->
<div class="flex items-center justify-between w-full">
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[30px]" style="font-variation-settings: &quot;FILL&quot; 1;">wb_twilight</span>
</div>
<button aria-label="Read Afternoon slot time" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant" onclick="event.stopPropagation(); speakInstruction('Afternoon slot, 3:00 PM')" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
<!-- Label and Time -->
<div class="mt-2 text-left">
<span class="block font-label-lg text-label-lg text-on-surface uppercase tracking-wide">Afternoon</span>
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-surface">3:00 <span class="text-label-lg font-bold">PM</span></span>
</div>
<!-- Selection Checkmark Placeholder -->
<div class="check-badge hidden absolute top-3 right-3 w-8 h-8 rounded-full bg-primary-container text-on-primary items-center justify-center">
<span class="material-symbols-outlined text-[22px]">check</span>
</div>
</div>
<!-- 4. EVENING SLOT -->
<div aria-checked="false" class="time-card relative bg-surface-container-low rounded-xl p-4 flex flex-col justify-between min-h-[148px] shadow-sm active:scale-95 transition-all cursor-pointer" onclick="selectSlot(this, 'Evening at 5:00 PM')" role="radio" tabindex="0">
<!-- Top Status & Audio Button -->
<div class="flex items-center justify-between w-full">
<div class="w-11 h-11 rounded-lg bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[30px]" style="font-variation-settings: &quot;FILL&quot; 1;">nights_stay</span>
</div>
<button aria-label="Read Evening slot time" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant" onclick="event.stopPropagation(); speakInstruction('Evening slot, 5:00 PM')" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
<!-- Label and Time -->
<div class="mt-2 text-left">
<span class="block font-label-lg text-label-lg text-on-surface uppercase tracking-wide">Evening</span>
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-surface">5:00 <span class="text-label-lg font-bold">PM</span></span>
</div>
<!-- Selection Checkmark Placeholder -->
<div class="check-badge hidden absolute top-3 right-3 w-8 h-8 rounded-full bg-primary-container text-on-primary items-center justify-center">
<span class="material-symbols-outlined text-[22px]">check</span>
</div>
</div>
</div>
</section>
<!-- Visual Reminder Card with Pictogram -->
<div class="px-margin py-2">
<div class="bg-surface-container-high rounded-xl p-3.5 flex items-center gap-3">
<div class="w-12 h-12 rounded-xl bg-surface-container-lowest text-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[32px]">video_call</span>
</div>
<div class="flex flex-col text-left">
<span class="font-label-lg text-label-lg text-on-surface leading-snug">Doctor Video Call</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Phone will ring loudly at this time</span>
</div>
</div>
</div>
<!-- Big Call to Action Area -->
<div class="px-margin pt-3 flex flex-col gap-3">
<!-- Massive Primary Confirm Button -->
<button class="w-full h-18 py-4 px-6 bg-primary-container hover:bg-primary active:scale-95 text-on-primary rounded-xl flex items-center justify-center gap-3 shadow-lg focus:outline-none transition-all" id="confirmButton" onclick="handleBookingConfirm()" type="button">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: &quot;FILL&quot; 1;">calendar_check</span>
<span class="font-label-xl text-label-xl text-on-primary tracking-wide">CONFIRM &amp; BOOK</span>
</button>
</div>
<!-- Mandatory Emergency Callout Pad (Always isolated at perimeter) -->

</div>
<script>
  function speakInstruction(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  function selectSlot(cardElement, slotName) {
    // Deselect all cards
    document.querySelectorAll('.time-card').forEach(card => {
      card.setAttribute('aria-checked', 'false');
      card.classList.remove('is-selected', 'bg-primary-container', 'text-on-primary', 'shadow-md');
      card.classList.add('bg-surface-container-low', 'shadow-sm');

      // Update nested text & icons
      const badge = card.querySelector('.check-badge');
      if (badge) {
        badge.classList.add('hidden');
        badge.classList.remove('flex');
      }

      const textSpans = card.querySelectorAll('span');
      textSpans.forEach(span => {
        if (!span.classList.contains('material-symbols-outlined') && !span.classList.contains('text-label-lg')) {
          span.classList.remove('text-on-primary');
          span.classList.add('text-on-surface');
        }
      });
    });

    // Select clicked card
    cardElement.setAttribute('aria-checked', 'true');
    cardElement.classList.add('is-selected', 'bg-primary-container', 'text-on-primary', 'shadow-md');
    cardElement.classList.remove('bg-surface-container-low', 'shadow-sm');

    const badge = cardElement.querySelector('.check-badge');
    if (badge) {
      badge.classList.remove('hidden');
      badge.classList.add('flex');
    }

    const textSpans = cardElement.querySelectorAll('span');
    textSpans.forEach(span => {
      if (!span.classList.contains('material-symbols-outlined') && !span.classList.contains('text-label-lg')) {
        span.classList.remove('text-on-surface');
        span.classList.add('text-on-primary');
      }
    });

    speakInstruction('Selected ' + slotName);
  }

  function handleBookingConfirm() {
    speakInstruction('Booking confirmed with Doctor Sarah. Your phone will ring automatically.');
  }
</script></main>
