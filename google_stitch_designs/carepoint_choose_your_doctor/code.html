<span class="w-3 h-3 rounded-full bg-surface-container-lowest animate-ping"></span>
</span>

<div class="flex-1 min-w-0">

<span class="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-primary-container flex items-center justify-center shadow">
<span class="w-3 h-3 rounded-full bg-surface-container-lowest animate-ping"></span>
</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface truncate">

</div>
</div>

<span class="material-symbols-outlined text-3xl" style="font-variation-settings: &quot;FILL&quot; 1;">call</span>

<!-- Hidden Live Region for Screen Reader / Audio Feedback status -->
<div aria-live="polite" class="sr-only" id="voice-toast">Choose your doctor. Tap a doctor to start your visit.</div>
</div>
<script>
  function readAloud(phrase) {
    const liveRegion = document.getElementById('voice-toast');
    if (liveRegion) {
      liveRegion.innerText = phrase;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  function selectDoctor(doctorName, btnElement) {
    readAloud(doctorName + ' selected. Proceeding to consultation.');
    const buttons = document.querySelectorAll('article button[class*="bg-primary-container"]');
    buttons.forEach(b => {
      b.innerHTML = '<span class="material-symbols-outlined text-4xl">check_circle</span><span>SELECT</span>';
      b.classList.remove('bg-primary');
      b.classList.add('bg-primary-container');
    });

    btnElement.innerHTML = '<span class="material-symbols-outlined text-4xl">done_all</span><span>SELECTED</span>';
    btnElement.classList.remove('bg-primary-container');
    btnElement.classList.add('bg-primary');
  }

  function selectDay(element, dayLabel) {
    document.querySelectorAll('.day-tile').forEach(tile => {
      tile.setAttribute('aria-checked', 'false');
      tile.classList.remove('bg-secondary', 'text-on-secondary');
      tile.classList.add('bg-surface-container-high', 'text-on-surface');
    });

    element.setAttribute('aria-checked', 'true');
    element.classList.remove('bg-surface-container-high', 'text-on-surface');
    element.classList.add('bg-secondary', 'text-on-secondary');

    readAloud(dayLabel + ' selected');
  }
</script></main>
